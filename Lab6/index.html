<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunrise Sunset Times</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>

<header class="hero">
  <h1>Sunrise & Sunset Times</h1>
</header>

<main>
    <p id="timezoneDisplay">Timezone: </p>
    <section class="location">
    <select id="locationSelect">
      <option value="">Select Location</option>
      <option value="25.6866,-100.3161">Monterrey,MX</option>
      <option value="39.9075, 116.39723">Beijing,CH</option>
      <option value="40.4169, -3.7033">Madrid,SP</option>
      <option value="41.8781, -87.6298">Chicago,US</option>
      <option value="-37.8096, 144.9650">Melborn,AU</option>
      <option value="-23.55, -46.63">Sao Paulo,BR</option>
      <option value="6.230833, -75.590553">Medellin,CO</option>
      <option value="51.5074, -0.1277">London,UK</option>
      <option value="50.110924, 8.682127">Frankfurt,GE</option>
      <option value="48.8566, 2.3522">Paris,FR</option>
    </select>

    <button id="findTimesBtn">Find Times</button>
  </section>
  
  <p id="errorMsg"></p>

  <section class="data">
    <div class="card" id="todayCard">
      <h2>Today:</h2>
      <p>🌅 Sunrise: </p>
      <p>🌇 Sunset: </p>
      <p>🌄 Dawn: </p>
      <p>🌃 Dusk: </p>
      <p>⏳ Day Length: </p>
      <p>🕛 Solar Noon: </p>
    </div>
    
    <div class="card" id="tomorrowCard">
      <h2>Tomorrow:</h2>
      <p>🌅 Sunrise: </p>
      <p>🌇 Sunset: </p>
      <p>🌄 Dawn: </p>
      <p>🌃 Dusk: </p>
      <p>⏳ Day Length: </p>
      <p>🕛 Solar Noon: </p>
    </div>
  </section>
  </main>

<footer>
  <p>Data from https://sunrisesunset.io/api/</p>
</footer>

</body>
</html>
