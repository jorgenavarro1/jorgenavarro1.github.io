<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>

<h1>Tip Calculator</h1>

<form id="tipForm">

    <p>Currency Conversion:</p>
    <p>$1 USD = €0.95 EUR</p>
    <p>$1 USD = ₹85 INR</p>

    <label for="billTotal">Bill Total ($):</label>
    <input type="text" id="billTotal">
    
    <label for="totalWithTax">Total Bill with Tax (11%):</label>
    <input type="text" id="totalWithTax" disabled>

    <label for="currency">Select Currency:</label>
    <select id="currency">
        <option value="usd">US Dollars ($)</option>
        <option value="eur">Euro (€)</option>
        <option value="inr">Rupee (₹)</option>
    </select>
    
    <label for="tipRange">Tip Percentage:</label>
    <input type="range" id="tipRange" min="0" max="100" value="15">

    <label for="tipAmount">Converted Tip Amount:</label>
    <input type="text" id="tipAmount" disabled>

    <label for="finalTotal">Converted Total Bill with Tip & Tax:</label>
    <input type="text" id="finalTotal" disabled>
    <p id="errorMsg"></p>

</form>
</body>
</html>
